name: Publish OCI Artifact

on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  draft:
    uses: metal-stack/actions-common/.github/workflows/release-drafter.yaml@v1

  oci-ansible-role:
    uses: metal-stack/actions-common/.github/workflows/oci-release-vector-artifact.yaml@v1
    secrets: inherit
    with:
      artifact-type: ansible-role

  test:
    runs-on: ubuntu-latest
    container: ghcr.io/metal-stack/metal-deployment-base:latest
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: |
          make test
