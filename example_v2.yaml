---
# requires the mini-lab to be running
- name: Running modules
  hosts: localhost
  connection: local
  gather_facts: no
  environment:
    METALCTLV2_API_URL: http://v2.172.17.0.1.nip.io:8080

  tasks:
    - name: Create tenant
      metal_v2_tenant:
        identifier: test
        name: test
        description: test tenant
        avatar_url: http://test
        email: test@test.com
        # labels:
        #   a: b
        # state: absent
      register: tenant

    - name: Create project
      metal_v2_project:
        identifier: test
        name: test
        description: test project
        tenant: "{{ tenant.id }}"
        avatar_url: http://test
        # state: absent
      register: project

    - name: Create project token
      metal_v2_api_token:
        identifier: token-refresh
        description: refresh
        expires: 1d
        permissions:
          - subject: "{{ project.id }}"
            methods:
             - /metalstack.api.v2.TokenService/Refresh

    - name: Create admin token
      metal_v2_admin_token:
        user: metal-stack
        identifier: metal-bmc
        description: "for metal-bmc"
        expires: 1d
        permissions:
          - subject: "{{ project.id }}"
            methods:
             - /metalstack.infra.v2.BMCService/UpdateBMCInfo
             - /metalstack.api.v2.TokenService/Refresh
        # state: absent
