---
# requires the mini-lab to be running
- name: Running modules
  hosts: localhost
  connection: local
  gather_facts: no
  environment:
    METAL_APIV2_URL: http://v2.172.17.0.1.nip.io:8080

  tasks:
    - name: Create tenant
      metal_v2_admin_tenant:
        identifier: test
        name: test
        description: test tenant
        avatar_url: http://test
        email: test@test2.com
        # state: absent
      register: tenant

    # - name: Create tenant
    #   metal_v2_tenant:
    #     identifier: test
    #     name: test2
    #     description: test tenant2
    #     avatar_url: http://test2
    #     email: test@test.com2
    #     labels:
    #       a: b
        # state: absent

    - name: Create project
      metal_v2_project:
        identifier: test
        name: test2
        description: test project2
        tenant: "{{ tenant.id }}"
        avatar_url: http://test2
        # state: absent
      register: project

    # - name: Create project token
    #   metal_v2_api_token:
    #     identifier: token-refresh-2
    #     description: refresh
    #     expires: 1d
    #     labels: {}
    #     permissions:
    #       - self:
    #           methods:
    #             - /metalstack.api.v2.TokenService/Refresh
    #             - /metalstack.api.v2.TokenService/List

    - name: Create admin token
      metal_v2_admin_token:
        user: metal-stack
        identifier: metal-bmc
        description: "for metal-bmc"
        expires: 1d
        permissions:
          - self:
              methods:
              - /metalstack.api.v2.TokenService/Refresh
              - /metalstack.api.v2.TokenService/List
          - infra:
              methods:
              - /metalstack.infra.v2.BMCService/UpdateBMCInfo
        # state: absent
